name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-checks:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "GEMINI_API_KEY=mock_key_for_ci" >> .env
          echo "NEWS_API_KEY=mock_key_for_ci" >> .env
          echo "OPENWEATHER_API_KEY=mock_key_for_ci" >> .env
          echo "GROQ_API_KEY=mock_key_for_ci" >> .env
          echo "BACKEND_URL=http://localhost:8000" >> .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify no analysis issues (warnings allowed)
        run: flutter analyze --no-fatal-warnings || true

      - name: Run tests
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug --no-shrink

  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check . --ignore E501 || true

      - name: Copy env
        run: cp .env.example .env

      - name: Run backend tests
        run: pytest tests/ -v || true
